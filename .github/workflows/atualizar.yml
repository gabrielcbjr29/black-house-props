# Coleta os dados do dia e publica o app no GitHub Pages.
# A COLETA roda no seu computador (runner próprio, internet de casa): a NBA bloqueia servidores
# de nuvem, mas não conexões residenciais. Se o computador estiver desligado, a coleta fica na
# fila e roda quando ele ligar (o GitHub guarda por até 24 h). Para voltar a coletar na nuvem
# (com a ESPN como fonte), crie a variável COLETOR = nuvem em Settings → Secrets and variables
# → Actions → Variables. A PUBLICAÇÃO do site sempre roda na nuvem.
# Horários (Brasília): 10h (abertura), 15h, 18h30, 20h30 (quintetos e linhas mais perto do fechamento)
# e 22h (jogos da costa oeste). Também roda quando você clica em "Run workflow".
name: Atualizar dados e publicar

on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 18 * * *'
    - cron: '30 21 * * *'
    - cron: '30 23 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'public/data/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ${{ vars.COLETOR == 'nuvem' && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Leitor de PDF (relatório oficial de lesões)
        run: pip install --quiet pypdf || true
      - name: Testes
        run: npm test
      - name: Coletar dados reais
        env:
          # chaves (Settings → Secrets and variables → Actions → Secrets)
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ajustes (aba Variables): economico | padrao | completo
          ODDS_MODE: ${{ vars.ODDS_MODE }}
          ODDS_MARKETS: ${{ vars.ODDS_MARKETS }}
          ODDS_BOOKMAKERS: ${{ vars.ODDS_BOOKMAKERS }}
          ODDS_MONTHLY_BUDGET: ${{ vars.ODDS_MONTHLY_BUDGET }}
          ODDS_CLOSE_WINDOW: ${{ vars.ODDS_CLOSE_WINDOW }}
          SGO_MAX_DAILY: ${{ vars.SGO_MAX_DAILY }}
          KALSHI: ${{ vars.KALSHI }}
          APP_URL: ${{ vars.APP_URL }}
          RADAR_MIN: ${{ vars.RADAR_MIN }}
          NOTIFY_UTC_HOURS: ${{ vars.NOTIFY_UTC_HOURS }}
        run: node collector/build.js
      - name: Salvar histórico e slate no repositório
        run: |
          git config user.name "garrafao-bot"
          git config user.email "garrafao-bot@users.noreply.github.com"
          git add data public/data
          git diff --cached --quiet || git commit -m "dados: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin main || true
          git push

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # pega a versão mais nova (com os dados que a coleta acabou de salvar)
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
