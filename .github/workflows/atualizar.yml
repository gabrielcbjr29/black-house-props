# Coleta os dados do dia e publica o app no GitHub Pages.
# A COLETA roda na nuvem do GitHub, com a ESPN como fonte (a NBA bloqueia servidores de nuvem).
# Com o runner próprio instalado no seu computador, crie a variável COLETOR = computador em
# Settings → Secrets and variables → Actions → Variables: a coleta passa a sair pela sua internet
# de casa e usa as fontes oficiais da NBA. A PUBLICAÇÃO do site sempre roda na nuvem.
# Horários (Brasília): 10h (abertura), 15h, 18h30, 20h30 (quintetos e linhas mais perto do fechamento)
# e 22h (jogos da costa oeste). Também roda quando você clica em "Run workflow".
name: Atualizar dados e publicar

on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 18 * * *'
    - cron: '30 21 * * *'
    - cron: '30 23 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      odds_agora:
        description: 'Buscar as odds das casas agora (gasta ~2 créditos por jogo do plano grátis)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ['data/**', 'public/data/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ${{ vars.COLETOR == 'computador' && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Leitor de PDF (relatório oficial de lesões)
        run: pip install --quiet pypdf || true
      - name: Testes
        run: npm test
      - name: Coletar dados reais
        env:
          # chaves (Settings → Secrets and variables → Actions → Secrets)
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ajustes (aba Variables): economico | padrao | completo
          ODDS_MODE: ${{ vars.ODDS_MODE || 'economico' }}
          ODDS_FORCE: ${{ inputs.odds_agora && '1' || '' }}
          ODDS_MARKETS: ${{ vars.ODDS_MARKETS }}
          ODDS_BOOKMAKERS: ${{ vars.ODDS_BOOKMAKERS }}
          ODDS_MONTHLY_BUDGET: ${{ vars.ODDS_MONTHLY_BUDGET }}
          ODDS_CLOSE_WINDOW: ${{ vars.ODDS_CLOSE_WINDOW }}
          SGO_MAX_DAILY: ${{ vars.SGO_MAX_DAILY }}
          KALSHI: ${{ vars.KALSHI }}
          APP_URL: ${{ vars.APP_URL }}
          RADAR_MIN: ${{ vars.RADAR_MIN }}
          NOTIFY_UTC_HOURS: ${{ vars.NOTIFY_UTC_HOURS }}
        run: node collector/build.js
      # Modelo BH: modelos por mercado treinados no histórico (model/), previsões gravadas no slate.json
      - name: Modelo BH (previsões por mercado)
        continue-on-error: true
        timeout-minutes: 10
        env:
          # odds reais dos tops do Modelo BH (teste de lucro): reb+ast, arremessos convertidos e lances tentados
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 -m pip install --quiet pandas scikit-learn scipy || pip install --quiet pandas scikit-learn scipy
          python3 model/predict.py public/data/slate.json
          node collector/rebuild-bot.js
      - name: Salvar histórico e slate no repositório
        run: |
          git config user.name "garrafao-bot"
          git config user.email "garrafao-bot@users.noreply.github.com"
          git add data public/data
          git diff --cached --quiet || git commit -m "dados: $(date -u +%Y-%m-%dT%H:%MZ)"
          # se outra coleta salvou dados nesse meio tempo, os desta coleta (mais novos) prevalecem
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # pega a versão mais nova (com os dados que a coleta acabou de salvar)
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      # cards em imagem das melhores entradas (o bot do Telegram envia por /cards e pelos botões 🖼️)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar cards em imagem
        continue-on-error: true
        timeout-minutes: 10
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.48.2
          npx playwright install --with-deps chromium
          node scripts/cards.mjs public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
