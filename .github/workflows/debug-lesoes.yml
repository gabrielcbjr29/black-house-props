# temporário: confere o leitor do relatório oficial de lesões no PDF real (será removido)
name: debug lesoes
on: workflow_dispatch
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 20 }
      - run: pip install --quiet pypdf
      - run: |
          node -e '
          import("./collector/injuryreport.js").then(async m => {
            const r = await m.fetchOfficialInjuries({ date: "2026-11-17", hoursBack: 6 });
            const v = Object.values(r.injuries).filter(x => !x.alias);
            console.log(r.report, v.length, "jogadores");
            for (const x of v) console.log(x.team, x.name, x.status, "|", x.note);
          })'
