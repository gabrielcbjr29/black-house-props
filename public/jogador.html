<style>
/* Aba Jogador (23/11): mapa de arremessos, teia de passes, rebotes, combinados e "quem está fora".
   Dados: data/jogador/<TIME>.json (collector/jogador.js, jogada a jogada da ESPN). Lógica em jogador-core.js. */
.jg { padding-top: 20px; padding-bottom: 96px; }
.jg-busca { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.jg-busca input { flex: 1 1 260px; min-width: 0; font: 600 16px var(--f); color: var(--ink); background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 11px 14px; }
.jg-busca input:focus { outline: 2px solid var(--green); outline-offset: 1px; }
.jg-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.jg-pick { font: 700 13px var(--f); color: var(--ink-2); background: var(--surface); border: 1px solid var(--line-2); border-radius: 999px; padding: 8px 14px; cursor: pointer; min-height: 38px; }
.jg-pick.on { background: var(--ink); color: #050605; border-color: var(--ink); }
.jg-tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; margin: 4px 0 16px; overflow-x: auto; }
.jg-tabs button { flex: 1; font: 800 13.5px var(--f); color: var(--muted); background: none; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer; white-space: nowrap; min-height: 42px; }
.jg-tabs button.on { background: var(--green); color: var(--green-ink); }
.jg-hero { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px 24px; margin-bottom: 14px; }
.jg-hero h1 { margin: 0; font-size: 28px; line-height: 1.1; font-weight: 800; }
.jg-hero p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }
.jg-selo { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: #111; border: 1px solid var(--line-2); font-weight: 800; font-size: 13px; color: #fff; margin-right: 12px; vertical-align: middle; }
.jg-kpis { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.jg-kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 9px 13px; min-width: 92px; }
.jg-kpi b { display: block; font-size: 20px; font-weight: 800; } .jg-kpi small { color: var(--muted); font-size: 11px; }
.jg-kpi.ln { display: flex; align-items: center; gap: 8px; }
.jg-kpi.ln button { font: 800 16px var(--f); width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink); cursor: pointer; }
.jg-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: 14px; }
@media (max-width: 820px) { .jg-grid { grid-template-columns: minmax(0, 1fr); } .jg-kpis { margin-left: 0; } }
.jg-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; min-width: 0; }
.jg-card h2 { margin: 0 0 2px; font-size: 15px; font-weight: 800; }
.jg-card .sub { margin: 0 0 12px; color: var(--muted); font-size: 12.5px; }
.jg-full { grid-column: 1 / -1; }
.jg svg text { font-family: var(--f); }
.jg-leg { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--ink-2); margin-top: 10px; }
.jg-leg i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.jg table { width: 100%; border-collapse: collapse; font-size: 13px; }
.jg th { position: static; background: none; white-space: normal; color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; text-align: right; padding: 6px; border-bottom: 1px solid var(--line); }
.jg th:first-child, .jg td:first-child { text-align: left; }
.jg td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; }
.jg tr.eu td { background: rgba(47, 208, 127, .07); } .jg tr.eu td:first-child { box-shadow: inset 3px 0 0 var(--green); }
.jg-bar { height: 5px; border-radius: 3px; margin-top: 4px; }
.jg-stack { display: flex; height: 34px; border-radius: 10px; overflow: hidden; margin: 6px 0 10px; }
.jg-stack div { display: grid; place-items: center; font-size: 12px; font-weight: 800; color: #03140A; min-width: 0; overflow: hidden; white-space: nowrap; }
.jg-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.jg-chip { font: 600 12.5px var(--f); color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 999px; padding: 7px 12px; cursor: pointer; min-height: 36px; }
.jg-chip[aria-pressed=true] { background: var(--bad-soft); border-color: #6b2a22; color: var(--bad); text-decoration: line-through; }
.jg-chip.sel[aria-pressed=true] { background: var(--green); border-color: var(--green); color: var(--green-ink); text-decoration: none; }
.jg .up { color: var(--green); font-weight: 700; } .jg .dn { color: var(--bad); font-weight: 700; } .jg .mut { color: var(--muted); }
.jg-nota { margin-top: 12px; font-size: 12px; color: var(--muted); line-height: 1.5; }
.jg-read { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
@media (max-width: 820px) { .jg-read { grid-template-columns: minmax(0, 1fr); } }
.jg-rd { background: var(--surface-2); border: 1px solid var(--line); border-left: 3px solid var(--green); border-radius: 12px; padding: 11px 12px; font-size: 13px; color: var(--ink-2); }
.jg-rd b { color: var(--ink); } .jg-rd.g { border-left-color: var(--gold); } .jg-rd.r { border-left-color: var(--bad); }
.jg-vazio { padding: 40px 16px; text-align: center; color: var(--muted); }
.jg button:focus-visible, .jg a:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
</style>
</head>

an></a><a href="radar.html" title="Radar +EV"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12l6-6"/></svg><span>Radar</span></a><a href="./#banca" title="Banca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v12H3zM3 7l3-4h12l3 4M16 13h2"/></svg><span>Banca</span></a><a href="./#guia" title="Guia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 1c0 1.8-2.5 2.2-2.5 3.8M12 17.2v.3"/></svg><span>Guia</span></a>

<script type="module">
import { MERCADOS as MK, COMBOS, porJogador, rotacao, ajuste } from './jogador-core.js';
import { linhaViva, prancheta } from './vivos.js';
const NS = 'http://www.w3.org/2000/svg';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const el = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; };
const f1 = (n, d = 1) => (Math.round(n * 10 ** d) / 10 ** d).toFixed(d).replace('.', ',');
const pc = n => Math.round(n * 100) + '%';
const PAL = ['#2FD07F', '#E8B64C', '#6FB7FF', '#C792EA', '#FF8A65', '#4DD0E1', '#5d6660'];
const ABAS = { pts: 'Pontos', tpm: '3PM', reb: 'Rebotes', ast: 'Assistências', combo: 'Combinados' };
const NO = { pts: 'nos pontos', tpm: 'no 3PM', reb: 'nos rebotes', ast: 'nas assistências' };
const dist = (x, y) => Math.hypot(x - 25, y);
const noCampo = (x, y) => x != null && y != null && x >= -1 && x <= 51 && y <= 31;
const zona3 = (x, y) => y <= 8.95 ? (x < 25 ? 'Canto esq.' : 'Canto dir.') : x < 17 ? 'Ala esq.' : x > 33 ? 'Ala dir.' : 'Topo';
const conta = arr => { const m = {}; arr.forEach(k => m[k] = (m[k] || 0) + 1); return Object.entries(m).map(([k, v]) => [+k, v]).sort((a, b) => b[1] - a[1]); };
const ler = k => { try { return localStorage.getItem(k); } catch { return null; } };
const gravar = (k, v) => { try { localStorage.setItem(k, v); } catch { } };

let IDX = null, T = null, PJ = null, ROT = null, CASA = {}, PV = null;
const MKC = { pts: 'PTS', tpm: '3PM', reb: 'REB', ast: 'AST' };
const casaDe = () => { const mk = S.m === 'combo' ? S.combo : MKC[S.m]; const v = CASA[S.p + '|' + mk]; return v == null ? null : v; };
const CACHE = {};
const S = { p: null, m: 'pts', fora: new Set(), combo: 'PRA', linha: null };

async function getJ(u) { const r = await fetch(u, { cache: 'no-cache' }); if (!r.ok) throw new Error(r.status); return r.json(); }
async function abrirTime(t) { T = CACHE[t] ||= await getJ(`data/jogador/${t}.json`); PJ = porJogador(T); ROT = rotacao(T, PJ); }
const nome = i => T.nomes[i] || String(i);
const sob = i => nome(i).split(' ').slice(-1)[0];
const kOf = mk => T.k?.[mk]?.k ?? 0.5;

function quadra(box) {
  const s = el('svg', { viewBox: '-1 -7 52 39', width: '100%', role: 'img', 'aria-label': 'Meia quadra' }); box.appendChild(s);
  el('rect', { x: -1, y: -7, width: 52, height: 39, fill: '#0A0C0B' }, s);
  const g = el('g', { fill: 'none', stroke: '#2E3531', 'stroke-width': .28 }, s);
  el('rect', { x: 0, y: -5.25, width: 50, height: 37 }, g); el('rect', { x: 17, y: -5.25, width: 16, height: 19, fill: 'rgba(47,208,127,.04)' }, g);
  el('circle', { cx: 25, cy: 13.75, r: 6 }, g); el('line', { x1: 22, y1: -1.25, x2: 28, y2: -1.25, 'stroke-width': .4 }, g);
  el('circle', { cx: 25, cy: 0, r: .75, stroke: '#E8B64C', 'stroke-width': .3 }, g); el('path', { d: 'M21 0 A4 4 0 0 0 29 0' }, g);
  el('path', { d: 'M3 -5.25 L3 8.95 A23.75 23.75 0 0 0 47 8.95 L47 -5.25' }, g);
  return s;
}
function legenda(box, items) { const d = document.createElement('div'); d.className = 'jg-leg'; d.innerHTML = items.map(([c, t, h]) => `<span><i style="${h ? 'border:1.5px solid ' + c : 'background:' + c}"></i>${esc(t)}</span>`).join(''); box.appendChild(d); }
function tabela(box, cab, linhas) { const t = document.createElement('table'); t.innerHTML = `<thead><tr>${cab.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${linhas.join('')}</tbody>`; box.appendChild(t); }
function stack(box, partes) {
  const tot = partes.reduce((s, p) => s + p[1], 0) || 1; const d = document.createElement('div'); d.className = 'jg-stack';
  d.innerHTML = partes.map(([n, v, c]) => `<div style="flex:${v};background:${c}" title="${esc(n)}">${v / tot > .09 ? pc(v / tot) : ''}</div>`).join(''); box.appendChild(d);
  legenda(box, partes.map(([n, v, c]) => [c, `${n} · ${f1(v)} (${pc(v / tot)})`]));
}
function teia(box, lista, centro, sub) {
  const s = el('svg', { viewBox: '0 0 460 360', width: '100%', role: 'img', 'aria-label': 'Teia de passes' }); box.appendChild(s);
  const cx = 230, cy = 180, R = 135, max = lista[0]?.[1] || 1;
  lista.forEach((r, i) => { const a = -Math.PI / 2 + i * 2 * Math.PI / lista.length; r._p = [cx + R * Math.cos(a), cy + R * Math.sin(a), PAL[i] || '#5d6660', a]; el('line', { x1: cx, y1: cy, x2: r._p[0], y2: r._p[1], stroke: r._p[2], 'stroke-width': 1.5 + r[1] / max * 12, 'stroke-linecap': 'round', opacity: .55 }, s); });
  el('circle', { cx, cy, r: 34, fill: '#0D2A1B', stroke: '#2FD07F', 'stroke-width': 2 }, s);
  el('text', { x: cx, y: cy - 2, 'text-anchor': 'middle', fill: '#F1F4F2', 'font-size': 13, 'font-weight': 800 }, s).textContent = centro;
  el('text', { x: cx, y: cy + 14, 'text-anchor': 'middle', fill: '#8B958F', 'font-size': 11 }, s).textContent = sub;
  lista.forEach(r => { const [x, y, c, a] = r._p, rr = 8 + r[1] / max * 12; el('circle', { cx: x, cy: y, r: rr, fill: '#0F1110', stroke: c, 'stroke-width': 2.2 }, s);
    el('text', { x, y: y + 4, 'text-anchor': 'middle', fill: '#F1F4F2', 'font-size': 11, 'font-weight': 800 }, s).textContent = r[1];
    el('text', { x, y: y + (Math.sin(a) > 0.2 ? rr + 14 : -rr - 7), 'text-anchor': 'middle', fill: '#C5CCC7', 'font-size': 11.5, 'font-weight': 600 }, s).textContent = r[0]; });
}
const valComb = (r, c) => COMBOS[c].reduce((s, k) => s + MK[k].v(r), 0);
const vOf = r => S.m === 'combo' ? valComb(r, S.combo) : MK[S.m].v(r);
function aj(fora) {
  if (S.m !== 'combo') return ajuste(T, S.m, fora, kOf(S.m), S.p, PJ, ROT);
  const parts = COMBOS[S.combo].map(k => [k, ajuste(T, k, fora, kOf(k), S.p, PJ, ROT)]); const out = {};
  for (const i of Object.keys(parts[0][1])) { out[i] = { n: 0, a: 0, parts: {} }; parts.forEach(([k, o]) => { out[i].n += o[i].n; out[i].a = o[i].a == null || out[i].a == null ? null : out[i].a + o[i].a; out[i].parts[k] = o[i]; }); }
  return out;
}

function render() {
  const P = S.p, J = PJ[P] || [], n = J.length, mk = S.m;
  const jogo = gi => T.jogos[gi];
  $('#players').innerHTML = [...new Set([...ROT, P])].map(i => `<button class="jg-pick ${i === P ? 'on' : ''}" data-p="${i}">${esc(nome(i))}</button>`).join('');
  $('#tabs').innerHTML = Object.entries(ABAS).map(([k, v]) => `<button role="tab" aria-selected="${k === mk}" class="${k === mk ? 'on' : ''}" data-m="${k}">${v}</button>`).join('');
  if (!n) { $('#conteudo').innerHTML = '<div class="jg-vazio">Sem jogos deste jogador na temporada.</div>'; return; }
  const vals = J.map(vOf), med = vals.reduce((s, v) => s + v, 0) / n;
  const so = vals.slice().sort((a, b) => a - b), mediana = (so[Math.floor((n - 1) / 2)] + so[Math.ceil((n - 1) / 2)]) / 2;
  if (S.linha == null) S.linha = casaDe() ?? Math.max(.5, Math.floor(mediana) + .5);
  const L = S.linha, acima = vals.filter(v => v > L).length, u10 = vals.slice(-10), ult10 = u10.filter(v => v > L).length;
  const nomeM = mk === 'combo' ? S.combo : MK[mk].nome, noM = mk === 'combo' ? 'no ' + S.combo : NO[mk];
  const sh = T.sh.filter(r => r[1] === P).map(r => [r[5], r[6], r[3], r[4], r[2]]);
  const ps = T.sh.filter(r => r[2] === P).map(r => [r[5], r[6], r[4], r[1]]);
  const rb = T.rb.filter(r => r[1] === P).map(r => [r[3], r[4], r[2], r[5]]);
  $('#conteudo').innerHTML = `
  <div class="jg-hero"><div><h1><span class="jg-selo">${esc(T.t)}</span>${esc(nome(P))}</h1><p>${esc(nomeM)} · ${n} jogos nesta temporada (ESPN, jogada a jogada)</p></div>
   <div class="jg-kpis"><div class="jg-kpi"><b>${f1(med)}</b><small>média ${esc(nomeM)}</small></div><div class="jg-kpi"><b>${Math.max(...vals)}</b><small>máximo</small></div>
   <div class="jg-kpi ln"><button data-l="-1" aria-label="Baixar a linha">−</button><div><b id="kLin">${f1(L)}</b><small>linha</small></div><button data-l="1" aria-label="Subir a linha">+</button></div>
